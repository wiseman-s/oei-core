services:
  oei:
    build:
      context: .
      dockerfile: Dockerfile
    image: oei-core:local
    container_name: oei-core
    ports:
      - "8000:8000"
    volumes:
      - ./examples:/app/examples:ro
      - ./exports:/app/exports
      - oei-data:/app/data
    environment:
      OEI_LOG_LEVEL: INFO
      OEI_EXPORT_DIR: /app/exports
      OEI_DATA_DIR: /app/data
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import sys,urllib.request; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/v1/health', timeout=2).status == 200 else 1)"
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
    restart: unless-stopped

volumes:
  oei-data: