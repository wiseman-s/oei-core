name: OEI Core CI

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  test:
    name: Python tests and quality checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run tests
        run: pytest

      - name: Run Ruff
        run: ruff check .

      - name: Run Mypy
        run: mypy src/oei

  docker:
    name: Docker build and smoke test
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build image
        run: docker build -t oei-core:ci .

      - name: Start container
        run: |
          docker run -d --name oei-ci -p 8000:8000 oei-core:ci

          for i in $(seq 1 30); do
            if curl --silent --fail http://127.0.0.1:8000/v1/health > /dev/null; then
              echo "health OK"
              exit 0
            fi
            sleep 1
          done

          echo "Container health check failed"
          exit 1

      - name: Smoke test harmonise
        run: |
          curl --fail --silent --show-error \
            -X POST http://127.0.0.1:8000/v1/harmonise \
            -H "Content-Type: application/json" \
            -d '{"source_path":"examples/data/kenya_generation_a.csv","source_format":"csv","mapping_path":"examples/mappings/source_a.yaml"}' \
            | tee /tmp/response.json

          python -c "import json,sys; d=json.load(open('/tmp/response.json')); sys.exit(0 if d['is_valid'] and d['row_count'] == 3 else 1)"

      - name: Logs on failure
        if: failure()
        run: docker logs oei-ci || true

      - name: Stop container
        if: always()
        run: docker stop oei-ci || true