name: Feature request
description: Suggest a feature or improvement
title: "[feat] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: Describe the situation where you needed this.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - IO (CSV/JSON)
        - Mapping
        - Validation
        - API
        - CLI
        - Adapters
        - Provenance
        - Documentation
        - Other
    validations:
      required: true