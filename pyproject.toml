[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "oei-core"
version = "0.2.2"
description = "Open Energy Intelligence Core: an open-source integration and validation engine for energy data."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Simon Wanyoike", email = "alphageek254@gmail.com" }]
maintainers = [{ name = "Simon Wanyoike", email = "alphageek254@gmail.com" }]
keywords = [
  "energy",
  "open-data",
  "interoperability",
  "validation",
  "provenance",
  "reproducibility",
  "energy-modelling",
  "kenya",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering",
  "Topic :: Database",
  "Typing :: Typed",
]
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "pydantic>=2.6",
  "pydantic-settings>=2.2",
  "pandas>=2.2",
  "pyarrow>=15.0",
  "httpx>=0.27",
  "pyyaml>=6.0",
  "typer>=0.12",
  "rich>=13.7",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "pytest-asyncio>=0.25",
  "httpx2",
  "mypy>=1.9",
  "ruff>=0.4",
  "pre-commit>=3.7",
  "mkdocs-material>=9.5",
  "mkdocstrings[python]>=0.24",
  "types-pyyaml>=6.0",
  "pandas-stubs>=2.2",
  "build>=1.2",
  "twine>=5.0",
  "pip-licenses>=4.4",
]

[project.scripts]
oei = "oei.cli:app"

[project.urls]
Homepage = "https://github.com/wiseman-s/oei-core"
Documentation = "https://wiseman-s.github.io/oei-core/"
Repository = "https://github.com/wiseman-s/oei-core"
Issues = "https://github.com/wiseman-s/oei-core/issues"
Changelog = "https://github.com/wiseman-s/oei-core/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["src/oei"]

[tool.hatch.build.targets.sdist]
include = [
  "src/oei",
  "tests",
  "examples",
  "docs",
  "README.md",
  "LICENSE",
  "NOTICE",
  "CHANGELOG.md",
  "CITATION.cff",
  "MAINTAINERS.md",
]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "ARG", "PTH", "RET", "TID", "RUF"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ARG001", "S101"]
"src/oei/cli.py" = ["B008"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_unreachable = true
warn_unused_ignores = true
disallow_untyped_defs = true
disallow_any_generics = true
no_implicit_optional = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers --strict-config --cov=oei --cov-report=term-missing --cov-fail-under=85"
testpaths = ["tests"]
filterwarnings = ["error"]
asyncio_default_fixture_loop_scope = "function"
asyncio_default_test_loop_scope = "function"

[tool.coverage.run]
branch = true
source = ["oei"]

[tool.coverage.report]
exclude_lines = [
  "pragma: no cover",
  "raise NotImplementedError",
  "if TYPE_CHECKING:",
]
