source_name: kenya_generation_b
source_licence: CC-BY-4.0
source_uri: https://example.org/kenya_generation_b.json
timestamp_column: timestamp
schema_fields:
  - name: timestamp
    type: timestamp
    required: true
  - name: plant_name
    type: string
    required: true
  - name: technology
    type: categorical
    required: true
    allowed_values: [Geothermal, Wind, Hydro, Solar, Thermal]
  - name: capacity_mw
    type: float
    unit: MW
    required: true
    minimum: 0
  - name: generation_mwh
    type: float
    unit: MWh
    required: true
    minimum: 0
mappings:
  - source: timestamp
    target: timestamp
  - source: station
    target: plant_name
  - source: source
    target: technology
  - source: cap
    target: capacity_mw
  - source: energy
    target: generation_mwh